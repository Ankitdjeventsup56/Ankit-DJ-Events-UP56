<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Music - UP56</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: linear-gradient(135deg, #ff0066, #6600ff);
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .search {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .song {
            background: #222;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 12px;
        }

        .song h3 {
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <h1>🎧 DJ MUSIC UP56</h1>
    <p>Latest DJ Songs & Remixes</p>
</header>

<div class="container">

    <input
        type="text"
        class="search"
        placeholder="🔍 Search DJ Song..."
        onkeyup="searchSongs()"
        id="searchBox"
    >

    <div id="songList">

        <div class="song">
            <h3>DJ Song 1</h3>
            <audio controls>
                <source src="songs/song1.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <h3>DJ Song 2</h3>
            <audio controls>
                <source src="songs/song2.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <h3>DJ Song 3</h3>
            <audio controls>
                <source src="songs/song3.mp3" type="audio/mpeg">
            </audio>
        </div>

    </div>

</div>

<footer>
    © 2026 DJ Music UP56
</footer>

<script>
function searchSongs() {
    let input = document.getElementById("searchBox")
        .value.toLowerCase();

    let songs = document.querySelectorAll(".song");

    songs.forEach(function(song) {
        let title = song.innerText.toLowerCase();

        if (title.includes(input)) {
            song.style.display = "block";
        } else {
            song.style.display = "none";
        }
    });
}
</script>

</body>
</html>
